# Perfil "prod": PostgreSQL (Docker Compose / nuvem). Tudo vem de variáveis de ambiente.
# Ativação: SPRING_PROFILES_ACTIVE=prod  (já definido no Dockerfile)
# Aqui NÃO existe o script Oracle: o Hibernate cria as tabelas (mesmos nomes e colunas) no PostgreSQL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Carga de exemplo (usuários, áreas, leituras, alertas e relatos) quando o banco está vazio
app.seed.enabled=${SEED_ENABLED:true}
