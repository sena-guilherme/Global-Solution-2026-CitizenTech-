spring.application.name=agrosync-api
server.port=${PORT:8080}

# ---------- Banco de dados: Oracle (FIAP) ----------
# Usuário e senha vêm de variáveis de ambiente: NÃO grave a senha neste arquivo nem no GitHub.
#   DB_USER=seu RM    DB_PASSWORD=sua senha do Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# As tabelas (PRODUTOR, AREA, CULTURA, LEITURA_SOLO, ALERTA, PUBLICACAO) são criadas pelo script do banco
# (gs_2026.sql, disciplina de Banco de Dados). A API NÃO altera o schema: ddl-auto=none.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Upload de fotos da comunidade ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---------- JWT ----------
# Em produção defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres).
# O valor abaixo é apenas um padrão de DESENVOLVIMENTO e não é uma chave real.
app.jwt.secret=${JWT_SECRET:dev-only-chave-segura-troque-em-producao-0123456789}
app.jwt.expiration-minutes=1440

# ---------- Papéis ----------
# A tabela PRODUTOR não tem coluna de papel: os e-mails abaixo (separados por vírgula) entram como ADMIN.
app.security.admin-emails=${ADMIN_EMAILS:admin@agrosync.com}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:*}


# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
